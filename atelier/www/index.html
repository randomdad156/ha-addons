<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Business Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23171a23%22/%3E%3Cpath%20d%3D%22M16%204.5c4.2%204.2%206.2%207.2%206.2%2011.3A6.2%206.2%200%200%201%209.8%2016c0-2.1%201-3.8%202.6-5.3.2%201.6%201%202.4%201.9%202.8C13.7%2011.7%2013.9%209.2%2016%204.5z%22%20fill%3D%22%234cc9a0%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2219.2%22%20r%3D%222.5%22%20fill%3D%22%236d8bff%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1d212c; --line:#2a2f3d;
  --text:#e6e8ee; --muted:#9aa3b2; --accent:#6d8bff; --accent2:#4cc9a0;
  --warn:#f0a14b; --danger:#f06a6a; --ok:#4cc9a0; --chip:#252a36;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:208px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:18px 16px;font-weight:700;font-size:16px;letter-spacing:.3px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);padding:10px 12px;border-radius:8px;font-size:14px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:var(--accent);color:#fff;font-weight:600}
.nav .ico{width:18px;text-align:center}
.storage{padding:10px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.storage .stat{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.storage .dotmini{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.storage .dotmini.on{background:var(--ok)}
.storage .dotmini.save{background:var(--warn)}
.storage button{width:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px;border-radius:6px;font-size:11.5px}
.storage button:hover{border-color:var(--accent)}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:rgba(15,17,23,.85);backdrop-filter:blur(8px);z-index:5}
.topbar h1{margin:0;font-size:20px;font-weight:650}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.content{padding:24px;max-width:1180px}
/* Generic */
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:var(--accent);border:none;color:#fff;padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{background:var(--danger)}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);width:30px;height:30px;border-radius:6px;font-size:13px}
.iconbtn:hover{border-color:var(--accent);color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .label{color:var(--muted);font-size:12px;margin-bottom:6px}
.kpi .val{font-size:24px;font-weight:700}
.kpi .val.pos{color:var(--ok)} .kpi .val.neg{color:var(--danger)}
.kpi .sub{color:var(--muted);font-size:11.5px;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
.panel h2{margin:0 0 14px;font-size:15px;font-weight:650}
.panel h2 .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;border-radius:8px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-Delivered{background:rgba(76,201,160,.16);color:#5fd6ad}
.b-Shipped{background:rgba(109,139,255,.16);color:#93a8ff}
.b-Pending{background:rgba(240,161,75,.16);color:#f0a14b}
.b-InProgress{background:rgba(240,161,75,.16);color:#f0a14b}
.b-Returned{background:rgba(240,106,106,.16);color:#f06a6a}
.b-Cancelled{background:rgba(154,163,178,.16);color:#9aa3b2}
.stock-ok{color:#5fd6ad} .stock-low{color:#f0a14b} .stock-out{color:#f06a6a}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;font-size:13px;font-family:inherit}
.statussel{padding:4px 22px 4px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid transparent;cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 9px,calc(100% - 7px) 9px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.statussel:hover{border-color:var(--accent)}
.statussel option{background:var(--panel2);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=search]{min-width:200px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
label.fld input,label.fld select,label.fld textarea{color:var(--text);width:100%;min-width:0;max-width:100%}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:22px}
.modal h3{margin:0 0 16px;font-size:17px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.breakdown{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;font-size:13px}
.breakdown .ln{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.breakdown .ln span:last-child{color:var(--text);font-variant-numeric:tabular-nums}
.breakdown .ln.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:15px}
.breakdown .ln.total span{color:var(--accent2)}
.empty{color:var(--muted);text-align:center;padding:28px;font-size:13px}
.pill{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--muted)}
.chartwrap{width:100%;overflow:auto}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:80;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.banner{background:rgba(109,139,255,.1);border:1px solid rgba(109,139,255,.4);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner .x{flex-shrink:0}
.subnav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.subnav button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:13px}
.subnav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:760px){.sidebar{width:60px}.brand span,.nav button span.lbl,.storage{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span>Atelier</span><span id="brandVer" title="View changelog" style="margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);cursor:pointer;padding:2px 7px;border:1px solid var(--line);border-radius:20px"></span></div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="ico">📊</span><span class="lbl">Dashboard</span></button>
      <button data-view="orders"><span class="ico">🧾</span><span class="lbl">Orders</span></button>
      <button data-view="products"><span class="ico">📦</span><span class="lbl">Products</span></button>
      <button data-view="inventory"><span class="ico">🕯️</span><span class="lbl">Inventory</span></button>
      <button data-view="expenses"><span class="ico">💸</span><span class="lbl">Expenses</span></button>
      <button data-view="platforms"><span class="ico">🛒</span><span class="lbl">Platforms</span></button>
      <button data-view="settings"><span class="ico">⚙️</span><span class="lbl">Settings</span></button>
    </nav>
    <div class="storage">
      <div class="stat"><span class="dotmini" id="storDot"></span><span id="storLabel">In-memory</span></div>
      <button id="btnConnect">Connect data file</button>
      <button id="btnExport">Export backup</button>
      <button id="btnImport">Import backup</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="sub" id="viewSub">Income, expenses and profit overview</div>
      </div>
      <div class="row" style="align-items:center"><select id="yearSel" title="Year (older years are archived but still viewable)" style="font-size:13px"></select><div class="row" id="topActions"></div></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
const SEED = {
  "version": 1,
  "settings": {},
  "platforms": [],
  "geniusBands": [],
  "products": [],
  "orders": [],
  "inventory": [],
  "expenses": []
};

/* ============ State & persistence ============ */
let state = null;
let fileHandle = null;
let usingFile = false;
let saveTimer = null;
const FSA = ('showSaveFilePicker' in window);
let pendingHandle=null;
let editedWhileDisconnected=false;
const APP_VERSION='1.2.0';
const CHANGELOG=[
  {v:'1.2.0',date:'2026-08-17',notes:'Trendyol shipping is now weight-based (FAN Courier, Romania) using each parcel weight, replacing the old sale-price bands. Parcels under 1 kg = 10.55 RON; the Settings shipping-bands editor is now in kg.'},
  {v:'1.1.1',date:'2026-06-02',notes:'Product/pack code is now editable when editing. Renaming a code checks for collisions and automatically remaps any pack components that referenced the old code.'},
  {v:'1.1.0',date:'2026-06-02',notes:'Adopted semantic versioning: features bump the minor version, fixes bump the patch. This 1.1.0 rolls up the recent feature work (pack builder, inventory materials with automatic stock decrement, Trendyol shipping bands) and the product-breakdown cleanup. The 1.0.x history below is kept as-is.'},
  {v:'1.0.14',date:'2026-06-02',notes:'Product expanded breakdown now shows the product-level price (costs + desired profit + PFA tax) without the channel-specific platform cut and Genius/shipping — those appear per channel in the Price-by-channel table below.'},
  {v:'1.0.13',date:'2026-06-02',notes:'Fixed the Save settings button spacing in Settings (it was cramped against the status checkboxes).'},
  {v:'1.0.12',date:'2026-06-02',notes:'Trendyol prices now include the platform shipping fee (Taxă de expediere) by sale-price band, mirroring how Emag Genius works. Genius still applies only to Emag. Added a Trendyol shipping bands editor in Settings; the Price-by-channel column shows Genius for Emag and shipping for Trendyol.'},
  {v:'1.0.11',date:'2026-06-02',notes:'The app file no longer embeds any data — all products, platforms, inventory, orders and expenses live only in atelier-data.json. A fresh app starts empty; Reset now clears everything.'},
  {v:'1.0.10',date:'2026-06-02',notes:'New expense no longer defaults its category to Materials — pick from the dropdown.'},
  {v:'1.0.9',date:'2026-06-02',notes:'Desired profit and Genius tax labels are single-line so their inputs align with Packaging cost / their row.'},
  {v:'1.0.8',date:'2026-06-02',notes:'Product editor layout: Additional cost aligns with Material cost, the inventory-materials list sits under them, and the Emag & Trendyol tiers share a row.'},
  {v:'1.0.7',date:'2026-06-02',notes:'Inventory items now have a unit price. Products can list inventory materials used (with quantities) whose cost is added to the price alongside the manual Additional cost. Placing a new order automatically decreases the stock of those inventory items. Packs inherit their components materials.'},
  {v:'1.0.6',date:'2026-06-02',notes:'Fixed modal layout overflow — long product names (e.g. packs) no longer push the right-hand fields outside the dialog.'},
  {v:'1.0.5',date:'2026-06-02',notes:'Pack builder: packaging cost is now editable (auto-fills to the largest component box, override it for a bigger box).'},
  {v:'1.0.4',date:'2026-06-02',notes:'Pack builder now has an editable Additional materials field (e.g. "3x tea light").'},
  {v:'1.0.3',date:'2026-06-02',notes:'New pack builder — create a product from existing products + quantities. It sums material weight, build time and additional cost; keeps the highest material rate, packaging (one box) and Emag/Trendyol tiers; and prices it automatically. Packs cannot be used as components of another pack.'},
  {v:'1.0.2',date:'2026-06-02',notes:'Expense category dropdown now lists the categories already used in your expenses (plus common defaults), instead of a fixed set.'},
  {v:'1.0.1',date:'2026-06-02',notes:'Lighter build — sample orders/expenses are no longer bundled inside the app file (your data loads from atelier-data.json), dropping the file from ~160 KB to ~60 KB. “Reset to seeded data” now clears to an empty ledger.'},
  {v:'1.0.0',date:'2026-06-02',notes:'First versioned release — dashboard with yearly archives, orders (inline status, product-scoped channels), per-product pricing (RON/kg material, PFA & Emag Genius, price-by-channel), inventory, expenses, platforms with PFA flag, daily auto-backups (rolling 7), file auto-save with one-click reconnect, and a collapsible, alphabetical product list.'}
];
function showChangelog(){
  openModal(`<h3>Changelog <span style="font-weight:400;color:var(--muted);font-size:13px">v${APP_VERSION}</span></h3>
    <div style="max-height:60vh;overflow:auto;margin-top:4px">${CHANGELOG.map(c=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="font-weight:650;font-size:14px">v${c.v}${c.date?` <span style="font-weight:400;color:var(--muted);font-size:12px">${c.date}</span>`:''}</div><div class="note" style="margin-top:4px">${escapeHtml(c.notes)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
}

function deepClone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* IndexedDB to remember the file handle */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('atelier-db',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');if(!db.objectStoreNames.contains('backups'))db.createObjectStore('backups');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const rq=t.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
const MAX_BACKUPS=7;
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isBackupKey(k){return /^\d{4}-\d{2}-\d{2}$/.test(k);}
async function backupPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('backups','readwrite');t.objectStore('backups').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function backupKeys(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('backups','readonly');const rq=t.objectStore('backups').getAllKeys();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);});}
async function backupGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('backups','readonly');const rq=t.objectStore('backups').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function backupDel(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('backups','readwrite');t.objectStore('backups').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function makeBackup(){try{const key=todayKey();await backupPut(key,{date:key,ts:Date.now(),orders:(state.orders||[]).length,expenses:(state.expenses||[]).length,json:JSON.stringify(state)});let keys=(await backupKeys()).filter(isBackupKey).sort();while(keys.length>MAX_BACKUPS)await backupDel(keys.shift());return true;}catch(e){return false;}}
async function maybeDailyBackup(){try{const keys=await backupKeys();if(keys.indexOf(todayKey())===-1)await makeBackup();}catch(e){}}
async function loadBackupList(){const el=document.getElementById('backupList');if(!el)return;let keys;try{keys=(await backupKeys()).filter(isBackupKey).sort().reverse();}catch(e){el.textContent='Backups are not available in this browser.';return;}if(!keys.length){el.textContent='No backups yet — one is created automatically each day.';return;}const snaps=await Promise.all(keys.map(k=>backupGet(k)));el.innerHTML='<div class="tablewrap"><table><thead><tr><th>Date</th><th class="num">Orders</th><th class="num">Expenses</th><th></th></tr></thead><tbody>'+snaps.map(s=>`<tr><td>${s.date}${s.date===todayKey()?' <span class="pill">today</span>':''}</td><td class="num">${s.orders}</td><td class="num">${s.expenses}</td><td style="text-align:right"><button class="btn sm ghost" data-brestore="${s.date}">Restore</button> <button class="btn sm ghost" data-bdown="${s.date}">Download</button></td></tr>`).join('')+'</tbody></table></div>';el.querySelectorAll('[data-brestore]').forEach(b=>b.onclick=()=>restoreBackup(b.dataset.brestore));el.querySelectorAll('[data-bdown]').forEach(b=>b.onclick=()=>downloadBackup(b.dataset.bdown));}
async function restoreBackup(key){const snap=await backupGet(key);if(!snap)return;openConfirm('Restore the backup from '+key+'? Your current data will be replaced. The current state is backed up first so you can undo.',async()=>{try{const keys=await backupKeys();if(keys.indexOf(todayKey())===-1)await makeBackup();state=migrate(JSON.parse(snap.json));save();toast('Restored backup from '+key);render();}catch(e){toast('Restore failed');}});}
async function downloadBackup(key){const snap=await backupGet(key);if(!snap)return;const blob=new Blob([snap.json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atelier-backup-'+key+'.json';a.click();toast('Downloaded '+key);}

function setStorageUI(){
  const dot=document.getElementById('storDot');const lbl=document.getElementById('storLabel');const btn=document.getElementById('btnConnect');
  if(dot)dot.className='dotmini on';if(lbl)lbl.textContent='Home Assistant';if(btn)btn.style.display='none';
}
function flashSaving(){const dot=document.getElementById('storDot');dot.className='dotmini save';}

function migrate(d){
  d.settings=Object.assign({currency:'RON',profitPerHour:4,pfaTaxRate:10,lowStockThreshold:5,incomeCountsStatuses:['Delivered','Shipped'],year:2026},d.settings||{});
  d.platforms=d.platforms||[];d.geniusBands=d.geniusBands||[];d.products=d.products||[];
  d.orders=d.orders||[];d.inventory=d.inventory||[];d.expenses=d.expenses||[];
  d.platforms.forEach(p=>{if(p.pfa===undefined)p.pfa=/emag|trendyol|trendiol|olx/i.test(p.name);});
  if(d._shipUnit!=='kg'){d.shippingBands=[{min:0,max:3,fee:10.55,tva:0,totalFee:10.55},{min:3,max:4,fee:11.31,tva:0,totalFee:11.31},{min:4,max:5,fee:12.07,tva:0,totalFee:12.07},{min:5,max:6,fee:12.83,tva:0,totalFee:12.83},{min:6,max:7,fee:13.59,tva:0,totalFee:13.59},{min:7,max:8,fee:14.35,tva:0,totalFee:14.35},{min:8,max:9,fee:15.11,tva:0,totalFee:15.11},{min:9,max:12,fee:17.38,tva:0,totalFee:17.38},{min:12,max:15,fee:19.66,tva:0,totalFee:19.66},{min:15,max:20,fee:23.46,tva:0,totalFee:23.46},{min:20,max:25,fee:27.78,tva:0,totalFee:27.78},{min:25,max:30,fee:31.65,tva:0,totalFee:31.65},{min:30,max:31,fee:35.92,tva:0,totalFee:35.92}];d._shipUnit='kg';}
  d.products.forEach(p=>{if(!p.tiers){p.tiers={};if(p.emagPlatform)p.tiers[familyOf(p.emagPlatform)]=p.emagPlatform;if(p.trendyolPlatform)p.tiers[familyOf(p.trendyolPlatform)]=p.trendyolPlatform;}if(!p.defaultPlatform||!d.platforms.some(pl=>pl.name===p.defaultPlatform)){p.defaultPlatform=p.tiers['Emag']||Object.values(p.tiers)[0]||(d.platforms[0]&&d.platforms[0].name)||'';}if(p.materialPricePerKg===undefined||p.materialPricePerKg===''){p.materialPricePerKg=((+p.materialWeight>0)&&(+p.materialCost>0))?Math.round((+p.materialCost)/((+p.materialWeight)/1000)*100)/100:100;}if(!p.materials)p.materials=[];});
  d.inventory.forEach(it=>{if(!it.id)it.id=uid();if(it.price===undefined)it.price=0;});
  d.orders.forEach(o=>{if(!o.id)o.id=uid();});
  return d;
}

async function connectFile(){
  if(!FSA){toast('Your browser does not support direct file save. Use Export/Import instead.');return;}
  try{
    const choice = await chooseNewOrOpen();
    if(choice==='open'){
      const [h]=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      const perm=await h.requestPermission({mode:'readwrite'});
      if(perm!=='granted'){toast('Permission denied');return;}
      const f=await h.getFile();const txt=await f.text();
      state=migrate(JSON.parse(txt));fileHandle=h;usingFile=true;
      await idbSet('fileHandle',h);
    } else if(choice==='new'){
      const h=await window.showSaveFilePicker({suggestedName:'atelier-data.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      fileHandle=h;usingFile=true;
      await idbSet('fileHandle',h);
      await save();
    } else return;
    pendingHandle=null;editedWhileDisconnected=false;setStorageUI();render();toast('Data file connected ✓');
  }catch(e){
    if(e.name==='AbortError')return;
    if(e.name==='SecurityError'||e.name==='NotAllowedError'){toast('Direct file access is blocked here. Use Export/Import for backups, or open the app from a local web server.');}
    else{toast('Error: '+e.message);}
  }
}

async function reconnect(){
  let h=null;
  try{h=await idbGet('fileHandle');}catch(e){}
  if(!h){return connectFile();}
  try{
    const perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){toast('Permission not granted. Click reconnect and choose Allow.');return;}
    if(editedWhileDisconnected){
      const choice=await chooseKeepOrLoad();
      if(choice===null)return;
      if(choice==='keep'){fileHandle=h;usingFile=true;pendingHandle=null;editedWhileDisconnected=false;await save();}
      else{const file=await h.getFile();const txt=await file.text();state=migrate(JSON.parse(txt));fileHandle=h;usingFile=true;pendingHandle=null;editedWhileDisconnected=false;}
    } else {
      const file=await h.getFile();const txt=await file.text();state=migrate(JSON.parse(txt));fileHandle=h;usingFile=true;pendingHandle=null;
    }
    await idbSet('fileHandle',h);
    setStorageUI();render();toast('Reconnected ✓');
  }catch(e){if(e.name!=='AbortError')toast('Reconnect failed: '+e.message);}
}

/* ============ Helpers ============ */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function cur(){return state.settings.currency||'RON';}
function fmt(n){return (Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function money(n){return fmt(n)+' '+cur();}
function monthOf(iso){return iso?parseInt(iso.slice(5,7),10)-1:null;}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isEmag(name){return /emag/i.test(name||'');}
function platformByName(n){return state.platforms.find(p=>p.name===n);}
function productByName(n){return state.products.find(p=>p.name===n);}
function productsByPopularity(){const cnt={};state.orders.forEach(o=>{cnt[o.product]=(cnt[o.product]||0)+1;});return state.products.slice().sort((a,b)=>(cnt[b.name]||0)-(cnt[a.name]||0)||a.name.localeCompare(b.name));}
function familyOf(name){return ((name||'').replace(/\s*\d+\s*$/,'').trim())||(name||'');}
function platformFamilies(){const fam={},order=[];state.platforms.forEach(p=>{const f=familyOf(p.name);if(!fam[f]){fam[f]=[];order.push(f);}fam[f].push(p);});return order.map(f=>[f,fam[f]]);}
function multiFamilies(){return platformFamilies().filter(fa=>fa[1].length>1);}
function resolvedChannelName(p,f,arr){if(arr.length===1)return arr[0].name;const sel=p.tiers&&p.tiers[f];return (sel&&arr.some(x=>x.name===sel))?sel:arr[0].name;}
function channelsForProduct(p){const out=[];platformFamilies().forEach(fa=>{out.push(fa[1].length===1?fa[1][0].name:resolvedChannelName(p,fa[0],fa[1]));});return out;}
function defaultChannelFor(p){const fams=platformFamilies();const emag=fams.find(fa=>fa[0].toLowerCase()==='emag');if(emag)return resolvedChannelName(p,emag[0],emag[1]);return (p&&p.defaultPlatform)||(channelsForProduct(p)[0]||'');}
function platformOptions(p,selected){let names=p?channelsForProduct(p):[];if(!names.length)names=state.platforms.map(x=>x.name);if(selected&&names.indexOf(selected)===-1)names=[selected].concat(names);return names.map(n=>`<option ${selected===n?'selected':''}>${escapeHtml(n)}</option>`).join('');}
function primaryPlatform(p){if(p.defaultPlatform&&platformByName(p.defaultPlatform))return p.defaultPlatform;if(p.tiers){for(const k in p.tiers){if(platformByName(p.tiers[k]))return p.tiers[k];}}return state.platforms[0]?state.platforms[0].name:'';}
function primaryTierVal(){const sels=document.querySelectorAll('.p_tier');for(const s of sels){if(/emag/i.test(s.value))return s.value;}return sels[0]?sels[0].value:(state.platforms[0]?state.platforms[0].name:'');}
function buildChannels(p){const groups=[];platformFamilies().forEach(fa=>{const name=resolvedChannelName(p,fa[0],fa[1]);const c=computePrice(p,name);const sig=Math.round(c.final*100)+'|'+Math.round(c.cut*1e4)+'|'+Math.round(c.genius*100)+'|'+Math.round(c.pfaAmt*100);let g=groups.find(x=>x.sig===sig);if(!g){g={sig,names:[],c:c};groups.push(g);}g.names.push(name);});return groups;}

/* ============ Pricing engine ============ */
function geniusFor(price){
  const b=state.geniusBands.find(b=>price>=b.min && price<=b.max);
  return b?b.totalTax:0;
}
function shippingFor(kg){const bs=(state.shippingBands||[]).slice().sort((a,b)=>a.max-b.max);const b=bs.find(x=>kg<=x.max);if(b)return b.totalFee!=null?b.totalFee:(+b.fee||0);const top=bs[bs.length-1];return top?(top.totalFee!=null?top.totalFee:(+top.fee||0)):0;}
function materialCostOf(p){if(p&&p.materialPricePerKg!=null&&p.materialPricePerKg!==''){return (+p.materialWeight||0)/1000*(+p.materialPricePerKg||0);}return (+(p&&p.materialCost)||0);}
function invById(id){return (state.inventory||[]).find(x=>x.id===id);}
function materialsCost(materials){let s=0;(materials||[]).forEach(m=>{const it=invById(m.invId);if(it)s+=(+it.price||0)*(+m.qty||0);});return s;}
function additionalCostOf(p){return p?((+p.additionalCost||0)+materialsCost(p.materials)):0;}
function computePrice(prod, platformName){
  const pf=platformByName(platformName)||{cut:0,fees:0,name:platformName||''};
  const base=materialCostOf(prod)+additionalCostOf(prod)+(+prod.packagingCost||0);
  const profit=(prod.desiredProfit!=null && prod.desiredProfit!=='')?(+prod.desiredProfit):((+state.settings.profitPerHour||0)*(+prod.buildTime||0));
  const cut=(+pf.cut||0)/100;
  const pfa=(pf.pfa?(+state.settings.pfaTaxRate||0)/100:0);
  const fees=(+pf.fees||0);
  const denom=Math.max(0.0001,1-cut-pfa);
  const emag=isEmag(pf.name);
  const trendyol=/trendyol|trendiol/i.test(pf.name);
  let genius=0,shipping=0;
  if(emag){
    if(prod.geniusOverride!=null && prod.geniusOverride!==''){genius=+prod.geniusOverride;}
    else{
      let g=0;
      for(let i=0;i<6;i++){const f=(base+profit+g+fees)/denom;const ng=geniusFor(f);if(ng===g)break;g=ng;}
      genius=g;
    }
  } else if(trendyol){
    shipping=shippingFor((+prod.materialWeight||0)/1000);
  }
  const feeAmt=genius+shipping;
  const final=(base+profit+feeAmt+fees)/denom;
  return {base,profit,genius,shipping,fee:feeAmt,fees,cut,pfa,cutAmt:final*cut,pfaAmt:final*pfa,final};
}

/* ============ Aggregations ============ */
function orderTotal(o){return (+o.itemSellPrice||0)*(+o.quantity||0);}
function countsAsIncome(o){return state.settings.incomeCountsStatuses.includes(o.status);}
function yearOf(iso){return iso?parseInt(iso.slice(0,4),10):null;}
function currentYear(){return new Date().getFullYear();}
let viewYear=currentYear();
function inViewYear(iso){return viewYear==='all'?true:yearOf(iso)===viewYear;}
function yearLabel(){return viewYear==='all'?'All years':String(viewYear);}
function availableYears(){const ys=new Set();state.orders.forEach(o=>{const y=yearOf(o.orderDate);if(y)ys.add(y);});state.expenses.forEach(e=>{const y=yearOf(e.date);if(y)ys.add(y);});ys.add(currentYear());return [...ys].sort((a,b)=>b-a);}
function ordersForYear(){return state.orders.filter(o=>inViewYear(o.orderDate));}
function expensesForYear(){return state.expenses.filter(e=>inViewYear(e.date));}
function monthlyAgg(){
  const inc=Array(12).fill(0),exp=Array(12).fill(0);
  state.orders.forEach(o=>{if(!inViewYear(o.orderDate))return;const m=monthOf(o.orderDate);if(m!=null&&countsAsIncome(o))inc[m]+=orderTotal(o);});
  state.expenses.forEach(e=>{if(!inViewYear(e.date))return;const m=monthOf(e.date);if(m!=null)exp[m]+=(+e.cost||0);});
  return {inc,exp};
}
function ytd(){
  const {inc,exp}=monthlyAgg();
  const income=inc.reduce((a,b)=>a+b,0),expenses=exp.reduce((a,b)=>a+b,0);
  return {income,expenses,profit:income-expenses};
}

function barChart(inc,exp){
  const W=720,H=240,pad=34,bw=W/12;
  const max=Math.max(1,...inc,...exp);
  const y=v=>H-pad-(v/max)*(H-2*pad);
  let bars='';
  for(let i=0;i<12;i++){
    const cx=i*bw+bw/2;
    const w=10;
    bars+=`<rect x="${cx-w-1}" y="${y(inc[i])}" width="${w}" height="${H-pad-y(inc[i])}" fill="var(--accent2)" rx="2"/>`;
    bars+=`<rect x="${cx+1}" y="${y(exp[i])}" width="${w}" height="${H-pad-y(exp[i])}" fill="var(--danger)" rx="2"/>`;
    bars+=`<text x="${cx}" y="${H-pad+14}" fill="var(--muted)" font-size="10" text-anchor="middle">${MONTHS[i].slice(0,3)}</text>`;
  }
  // net line
  let pts='';for(let i=0;i<12;i++){const cx=i*bw+bw/2;pts+=`${cx},${y(inc[i]-exp[i]>0?inc[i]-exp[i]:0)} `;}
  return `<svg viewBox="0 0 ${W} ${H}" style="min-width:680px;width:100%;height:${H}px">
    <line x1="${pad}" y1="${H-pad}" x2="${W}" y2="${H-pad}" stroke="var(--line)"/>
    <text x="2" y="${pad}" fill="var(--muted)" font-size="10">${fmt(max)}</text>
    ${bars}
  </svg>`;
}

/* ---- Inventory ---- */
function computePack(components){
  let weight=0,build=0,perKg=0,add=0,pkg=0,emag=null,trend=null;
  const mats={};
  const tn=n=>{const m=(n||'').match(/(\d+)/);return m?+m[1]:-1;};
  components.forEach(c=>{const p=state.products.find(x=>x.code===c.code);if(!p)return;const q=+c.qty||0;
    weight+=(+p.materialWeight||0)*q;build+=(+p.buildTime||0)*q;const _rate=(p.materialPricePerKg!=null&&p.materialPricePerKg!=='')?+p.materialPricePerKg:((+p.materialWeight>0)?(+p.materialCost||0)/((+p.materialWeight)/1000):100);perKg=Math.max(perKg,_rate);
    add+=(+p.additionalCost||0)*q;pkg=Math.max(pkg,+p.packagingCost||0);(p.materials||[]).forEach(m=>{if(!m.invId)return;mats[m.invId]=(mats[m.invId]||0)+(+m.qty||0)*q;});
    const e=p.tiers&&p.tiers['Emag'];if(e&&(!emag||tn(e)>tn(emag)))emag=e;
    const t=p.tiers&&p.tiers['Trendyol'];if(t&&(!trend||tn(t)>tn(trend)))trend=t;});
  const r2=x=>Math.round(x*100)/100;const tiers={};if(emag)tiers['Emag']=emag;if(trend)tiers['Trendyol']=trend;
  return {materialWeight:r2(weight),buildTime:r2(build),materialPricePerKg:r2(perKg),additionalCost:r2(add),packagingCost:r2(pkg),tiers,defaultPlatform:emag||trend||'',materials:Object.keys(mats).map(k=>({invId:k,qty:mats[k]}))};
}

const modalBg=document.getElementById('modalBg'),modal=document.getElementById('modal');
function openModal(html){modal.innerHTML=html;modalBg.classList.add('open');}
function closeModal(){modalBg.classList.remove('open');if(modalBg._cancel){const c=modalBg._cancel;modalBg._cancel=null;c();}}
modalBg.onclick=e=>{/* click-outside intentionally does NOT close; use Save/Cancel */};
function openConfirm(msg,fn){openModal(`<h3>Confirm</h3><p class="note">${escapeHtml(msg)}</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="cf_ok">Confirm</button></div>`);document.getElementById('cf_ok').onclick=()=>{closeModal();fn();};}
function confirmDel(type,id){
  if(type==='order'){const o=state.orders.find(x=>x.id===id);openConfirm('Delete order "'+o.product+'"?',()=>{state.orders=state.orders.filter(x=>x.id!==id);save();renderOrders();});}
  if(type==='product'){const p=state.products.find(x=>x.code===id);openConfirm('Delete product "'+p.name+'"?',()=>{state.products=state.products.filter(x=>x.code!==id);save();renderProducts();});}
}
let toastTimer;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function val(id){const e=document.getElementById(id);return e?e.value:'';}

/* ============ Boot ============ */
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view);});
document.getElementById('btnConnect').onclick=handleConnectButton;
document.getElementById('btnExport').onclick=exportData;
document.getElementById('btnImport').onclick=()=>document.getElementById('fileInput').click();
window.setView=setView;window.closeModal=closeModal;

const _bv=document.getElementById('brandVer');if(_bv){_bv.textContent='v'+APP_VERSION;_bv.onclick=showChangelog;}
document.title='Atelier (HA) v'+APP_VERSION;
(async function(){await loadInitial();setStorageUI();setView('dashboard');maybeDailyBackup();showReconnectPrompt();})();
</script>
